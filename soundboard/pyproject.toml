[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "soundboard"
version = "1.0.0"
description = "A Windows soundboard application for streamers and presenters with hotkey triggering, multi-format audio support, and persistent JSON storage. Built with PyQt6."
authors = ["Rayyan <Rayyan9000@outlook.com>"]
license = "MIT"
readme = "../README.md"
repository = "https://github.com/OneAutumnLeaf4700/Soundboard-Program"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
PyQt6 = "^6.4.0"
sounddevice = "^0.5.2"
numpy = "^1.24.0"
pydub = "^0.25.1"
audioop-lts = {version = "^0.2.1", python = ">=3.13"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
black = "^23.3.0"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
